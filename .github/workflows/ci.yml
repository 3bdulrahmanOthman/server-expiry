name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    lint:
        name: PHP Syntax
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v4

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.2'
                    coverage: none

            -   name: Lint PHP files
                run: |
                    shopt -s globstar
                    for file in **/*.php; do
                        php -l "$file"
                    done

    style:
        name: Code Style (Pint)
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v4

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.2'
                    tools: pint
                    coverage: none

            -   name: Check code style
                run: pint --test